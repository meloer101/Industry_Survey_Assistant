[project]
name = "investment-research-platform"
version = "0.1.0"
description = "AI Investment Research Platform — multi-agent research assistant with HITL and financial analysis"
requires-python = ">=3.12,<3.13"

dependencies = [
    "google-adk>=1.8.0",
    "litellm>=1.63.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
    "yfinance>=0.2.50",
    "pypdf>=5.0.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]