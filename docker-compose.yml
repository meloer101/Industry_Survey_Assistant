services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/app/.env
    environment:
      LOG_FORMAT: json
      # Default to false so the frontend (which has no Clerk key by default)
      # doesn't immediately get 401s. Set CLERK_AUTH_ENABLED=true in your
      # shell (or .env) when deploying with real Clerk credentials.
      CLERK_AUTH_ENABLED: ${CLERK_AUTH_ENABLED:-false}
    volumes:
      - session-data:/app/app/.adk
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  session-data:
